<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">TransSuperpre — New cards. Your language.</title>
  <desc id="description">A dark teal and violet banner with three glowing card silhouettes. Standard and Rush Duel pre-release translations for MDPro3.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101c2a"/>
      <stop offset="1" stop-color="#090f1a"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#4de3cf" stop-opacity=".17"/>
      <stop offset="1" stop-color="#4de3cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent">
      <stop stop-color="#70e5d3"/>
      <stop offset=".55" stop-color="#52bedb"/>
      <stop offset="1" stop-color="#a89bff"/>
    </linearGradient>
    <linearGradient id="card" x2="1" y2="1">
      <stop stop-color="#203f4b"/>
      <stop offset="1" stop-color="#142131"/>
    </linearGradient>
    <linearGradient id="gem" x2="1" y2="1">
      <stop stop-color="#bbfff0"/>
      <stop offset=".5" stop-color="#53dbc8"/>
      <stop offset="1" stop-color="#8880e9"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8bb1c9" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="bounds"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="360" fill="url(#background)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <ellipse cx="980" cy="160" rx="390" ry="300" fill="url(#halo)"/>
    <path d="M0 1H1280" stroke="url(#accent)" stroke-width="3"/>
    <path d="M774 360 927 0M1104 360 1257 0" stroke="#738ab6" stroke-opacity=".1"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="58" y="56" width="7" height="7" rx="2" fill="#70e5d3"/>
      <text x="79" y="65" font-size="13" font-weight="600" letter-spacing="2.7" fill="#95bacd">PRE-RELEASE TRANSLATIONS FOR MDPRO3</text>
      <text x="56" y="151" font-size="70" font-weight="700" letter-spacing="-2" fill="#f3f7fc">TransSuperpre</text>
      <text x="60" y="199" font-size="27" fill="#b5c6da">New cards. Your language.</text>
      <g font-size="12" font-weight="600" letter-spacing="1.5">
        <rect x="60" y="245" width="128" height="34" rx="17" fill="#17332f" stroke="#38675f"/>
        <text x="124" y="267" text-anchor="middle" fill="#98eddc">STANDARD</text>
        <rect x="199" y="245" width="138" height="34" rx="17" fill="#282741" stroke="#555073"/>
        <text x="268" y="267" text-anchor="middle" fill="#cbc2ff">RUSH DUEL</text>
        <rect x="348" y="245" width="156" height="34" rx="17" fill="#172431" stroke="#36495c"/>
        <text x="426" y="267" text-anchor="middle" fill="#bbcee0">LOCALIZE · PLAY</text>
      </g>
      <text x="61" y="324" font-size="12" letter-spacing="1" fill="#7d99b0">FETCH UPDATES  /  REVIEW TRANSLATIONS  /  PUBLISH</text>
    </g>

    <g transform="translate(1090 179) rotate(17)">
      <rect x="-79" y="-105" width="158" height="219" rx="12" fill="#8f83e6" opacity=".17" filter="url(#glow)"/>
      <rect x="-79" y="-105" width="158" height="219" rx="12" fill="#171e31" stroke="#7d75b4" stroke-opacity=".75"/>
      <rect x="-67" y="-92" width="134" height="132" rx="5" fill="#262841"/>
      <path d="M-54 64H42M-54 79H53M-54 94H15" stroke="#716791" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(903 181) rotate(-16)">
      <rect x="-79" y="-105" width="158" height="219" rx="12" fill="#112a34" stroke="#4b8791" stroke-opacity=".85"/>
      <rect x="-67" y="-92" width="134" height="132" rx="5" fill="#163b43"/>
      <circle cy="-26" r="35" fill="none" stroke="#356574"/>
      <path d="M-54 64H42M-54 79H53M-54 94H15" stroke="#3a6776" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(997 170) rotate(3)">
      <rect x="-91" y="-124" width="182" height="250" rx="14" fill="#65ead4" opacity=".15" filter="url(#glow)"/>
      <rect x="-91" y="-124" width="182" height="250" rx="14" fill="url(#card)" stroke="url(#accent)" stroke-width="1.5"/>
      <path d="M-70-101H26" stroke="#a2d6d5" stroke-width="5" stroke-linecap="round"/>
      <circle cx="65" cy="-101" r="5" fill="#76ead5"/>
      <rect x="-74" y="-81" width="148" height="142" rx="7" fill="#10242f" stroke="#345361"/>
      <circle cy="-10" r="53" fill="none" stroke="#3a6774" stroke-opacity=".6"/>
      <circle cy="-10" r="40" fill="none" stroke="#3a6774" stroke-dasharray="3 9"/>
      <path d="M0-46 28-10 0 26-28-10Z" fill="#76ead5" opacity=".4" filter="url(#glow)"/>
      <path d="M0-46 28-10 0 26-28-10Z" fill="url(#gem)"/>
      <path d="M0-46V26M-28-10H28" stroke="#dbfff4" stroke-opacity=".45"/>
      <path d="M-67 81H49M-67 95H66M-67 109H13" stroke="#7092a2" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="m1169 68 0 12m-6-6h12M828 271v10m-5-5h10" stroke="#7bacb8" stroke-opacity=".7"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="359" rx="20" fill="none" stroke="#334656"/>
</svg>
