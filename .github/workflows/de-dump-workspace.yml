name: Dump DE Workspace

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync DE Workspace"
    types: [completed]
  push:
    branches:
      - main
    paths:
      - ".github/scripts/schedule_guard.py"
      - "DE/Workspace/test-release.cdb"
      - ".github/scripts/dump_cdb.py"
      - ".github/workflows/de-dump-workspace.yml"

permissions:
  contents: write

concurrency:
  group: de-dump-workspace
  cancel-in-progress: false

jobs:
  dump:
    name: Publish DE dump folder
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether the dump changed
        id: freshness
        run: python3 .github/scripts/schedule_guard.py dump --locale DE

      - name: Set up Python
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Generate dump files
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python .github/scripts/dump_cdb.py \
            --cdb "DE/Workspace/test-release.cdb" \
            --out "$RUNNER_TEMP/de-workspace-dump" \
            --source-sha "$GITHUB_SHA" \
            --source-path "DE/Workspace/test-release.cdb" \
            --title "DE Workspace test-release.cdb Dump"

      - name: Publish dump branch
        if: steps.freshness.outputs.should_run == 'true'
        env:
          DUMP_DIR: ${{ runner.temp }}/de-workspace-dump
        run: |
          set -euo pipefail
          git config user.name "ElderLich"
          git config user.email "35314175+ElderLich@users.noreply.github.com"

          push_dump() {
            for attempt in 1 2 3; do
              if git push origin dump; then
                return 0
              fi
              echo "Dump push failed; rebasing and retrying (${attempt}/3)..."
              git pull --rebase origin dump
            done
            git push origin dump
          }

          if git ls-remote --exit-code --heads origin dump >/dev/null 2>&1; then
            git fetch origin dump
            git checkout -B dump origin/dump
          else
            git checkout --orphan dump
            git rm -r -f --ignore-unmatch .
          fi

          git rm -r -f --ignore-unmatch DE
          git rm -r -f --ignore-unmatch cards manifest.json schema.sql datas.csv texts.csv cards-index.csv
          mkdir -p DE
          cp -a "$DUMP_DIR"/. DE/
          rm -f DE/.gitattributes DE/.nojekyll

          cat > README.md <<'EOF'
          # Pre-Release Translations CDB Dumps

          Generated database dumps for reviewing translation CDB changes as text diffs.

          - `DE/`: DE Workspace `test-release.cdb`
          - `EN/`: EN Workspace `test-release.cdb`
          - `ES/`: ES Workspace `test-release.cdb`
          - `FR/`: FR Workspace `test-release.cdb`
          - `IT/`: IT Workspace `test-release.cdb`
          - `JP/`: JP Workspace `test-release.cdb`
          - `KR/`: KR Workspace `test-release.cdb`
          - `PT/`: PT Workspace `test-release.cdb`
          - `TH/`: TH Workspace `test-release.cdb`
          - `ZH-TW/`: ZH-TW Base Files `test-release.cdb`
          EOF
          printf "" > .nojekyll
          printf "*.csv diff\n*.json diff\n*.sql diff\n*.txt diff\n" > .gitattributes

          git add .
          if git diff --cached --quiet; then
            echo "No DE dump changes to publish."
            exit 0
          fi
          short_sha="${GITHUB_SHA::7}"
          git commit -m "Dump DE workspace from ${short_sha}"
          push_dump
