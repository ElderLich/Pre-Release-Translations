name: Update Rush pre-release cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Tools/rush_prerelease.py"
      - ".github/scripts/fetch_rush_sources.py"
      - "Tools/rush_source_text.py"
      - ".github/scripts/card_text_autofill.py"
      - ".github/scripts/codexygo_source.py"
      - "Shared/Rush/source_mappings.json"
      - "Tools/PromptPatcher.py"
      - "Shared/Mappings.csv"
      - ".github/scripts/shared_mappings.py"
      - ".github/scripts/tcg_autopr.py"
      - "Shared/Rush Artworks/**"
      - "Shared/Rush/config.json"
      - "*/Rush/Workspace/**"
      - ".github/workflows/rush-prerelease.yml"

permissions:
  contents: write

concurrency:
  group: rush-prerelease
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Get current Rush sources and translated databases
        run: |
          set -euo pipefail
          python .github/scripts/fetch_rush_sources.py \
            --source-root "$RUNNER_TEMP/rush-source" \
            --translations-root "$RUNNER_TEMP/rush-translations"

      - name: Reconcile, package and commit all Rush locales
        run: |
          set -euo pipefail
          git config user.name "ElderLich"
          git config user.email "35314175+ElderLich@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            python Tools/rush_prerelease.py sync \
              --source-root "$RUNNER_TEMP/rush-source" \
              --translations-root "$RUNNER_TEMP/rush-translations/Data/locales" \
              --summary-file "$RUNNER_TEMP/rush-summary.md"
            # Preserve pending translator work even when incomplete locales block publication.
            for path in Shared/Rush/source.json Shared/Rush/sets.md */Rush */rush-pre-release.ypk */rush-pre-release.json */rush-version.txt; do
              if [ -e "$path" ]; then git add -A -- "$path"; fi
            done
            if git diff --cached --quiet; then
              cat "$RUNNER_TEMP/rush-summary.md" >> "$GITHUB_STEP_SUMMARY"
              echo "No generated Rush changes to commit. See the summary for translation readiness."
              exit 0
            fi
            git commit -m "Update Rush pre-release cards in all locales"
            if git push origin "HEAD:$branch"; then
              cat "$RUNNER_TEMP/rush-summary.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Branch changed while building; retrying from its latest contents ($attempt/5)."
            sleep $((attempt * 5))
          done
          echo "Could not publish Rush packages after five attempts."
          exit 1
