name: Update Rush pre-release cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Tools/rush_prerelease.py"
      - ".github/scripts/fetch_rush_sources.py"
      - ".github/scripts/rush_source_archive.py"
      - "Tools/rush_source_text.py"
      - ".github/scripts/card_text_autofill.py"
      - ".github/scripts/codexygo_source.py"
      - "Shared/Rush/source_mappings.json"
      - "Tools/PromptPatcher.py"
      - "Shared/Mappings.csv"
      - ".github/scripts/shared_mappings.py"
      - ".github/scripts/tcg_autopr.py"
      - "Shared/Rush Artworks/**"
      - "Shared/Rush/config.json"
      - "*/Rush/Workspace/**"
      - ".github/scripts/release_git.py"
      - ".github/scripts/shared_builds.py"
      - ".github/workflows/rush-prerelease.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep every locale queued; only one job may publish to this branch at a time.
    concurrency:
      group: prerelease-writer-${{ github.event.workflow_run.head_branch || github.ref_name }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Get current Rush sources and translated databases
        env:
          AUTOPR_DOWNLOAD_CACHE: ${{ runner.temp }}/prerelease-downloads-${{ github.run_id }}
        run: |
          set -euo pipefail
          python .github/scripts/fetch_rush_sources.py \
            --source-root "$RUNNER_TEMP/rush-source" \
            --translations-root "$RUNNER_TEMP/rush-translations"

      - name: Reconcile, package, commit and tag Rush locales
        env:
          AUTOPR_DOWNLOAD_CACHE: ${{ runner.temp }}/prerelease-downloads-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "ElderLich"
          git config user.email "35314175+ElderLich@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
            python Tools/rush_prerelease.py sync \
              --source-root "$RUNNER_TEMP/rush-source" \
              --translations-root "$RUNNER_TEMP/rush-translations/Data/locales" \
              --summary-file "$RUNNER_TEMP/rush-summary.md"
            # Preserve pending translator work even when incomplete locales block publication.
            for path in Shared/Rush/source.json Shared/Rush/sets.md */Rush */rush-pre-release.ypk */rush-pre-release.json */rush-version.txt; do
              if [ -e "$path" ]; then git add -A -- "$path"; fi
            done
            if git diff --cached --quiet; then
              cat "$RUNNER_TEMP/rush-summary.md" >> "$GITHUB_STEP_SUMMARY"
              echo "No generated Rush changes to commit. See the summary for translation readiness."
              exit 0
            fi
            # Tag only locales whose package changed in this build.
            python .github/scripts/release_git.py list-tags > "$RUNNER_TEMP/rush-tags.txt"
            tags=()
            tag_refs=()
            for locale in EN DE ES FR IT JP KR PT TH ZH-CN ZH-TW; do
              package="$locale/rush-pre-release.ypk"
              if [ ! -f "$package" ] || git diff --cached --quiet -- "$package"; then
                continue
              fi
              next_tag_number=$(python .github/scripts/release_git.py next-number --prefix "${locale}_Rush-v" --tags-file "$RUNNER_TEMP/rush-tags.txt")
              tag="${locale}_Rush-v${next_tag_number}"
              tags+=("$tag")
              tag_refs+=("refs/tags/$tag")
            done
            commit_args=(-m "Update Rush pre-release cards in all locales")
            if [ "${#tags[@]}" -gt 0 ]; then
              commit_args+=(-m "Published Rush tags: ${tags[*]}")
            fi
            git commit "${commit_args[@]}"
            for tag in "${tags[@]}"; do
              git tag -a "$tag" -m "Release $tag"
            done
            # Publish every tag and the build together, or leave the remote untouched.
            if git push --atomic origin "HEAD:$branch" "${tag_refs[@]}"; then
              cat "$RUNNER_TEMP/rush-summary.md" >> "$GITHUB_STEP_SUMMARY"
              if [ "${#tags[@]}" -gt 0 ]; then
                printf '\n### Published Rush tags\n\n' >> "$GITHUB_STEP_SUMMARY"
                for tag in "${tags[@]}"; do
                  printf -- '- [%s](%s/%s/tree/%s)\n' "$tag" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
                done
              fi
              exit 0
            fi
            # Remove only tags created by this rejected attempt before fetching again.
            if [ "${#tags[@]}" -gt 0 ]; then
              git tag -d "${tags[@]}"
            fi
            echo "Branch changed while building; retrying from its latest contents ($attempt/5)."
            sleep $((attempt * 5))
          done
          echo "Could not publish Rush packages after five attempts."
          exit 1
